services:
  db:
    # The versions are in .test-versions. mysql:5.7 has no arm64 image, so
    # emulate amd64.
    image: mysql:${MYSQL_VERSION:?MYSQL_VERSION is not set (see .test-versions)}
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: prestashop
    volumes:
      - ps_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 40

  phpunit:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        PHP_VERSION: ${PHP_VERSION:?PHP_VERSION is not set (see .test-versions)}
    # Tagged by the PHP version, so a change of it builds a new image.
    image: miguel-prestashop-phpunit:php${PHP_VERSION:?PHP_VERSION is not set (see .test-versions)}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/project
      # PrestaShop is cloned + installed into this named volume once, then reused;
      # the host tree (including the corrupt host vendor2) is never touched.
      - ps_prestashop:/project/vendor2
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: password
      DB_NAME: prestashop
      PRESTASHOP_VERSION: ${PRESTASHOP_VERSION:?PRESTASHOP_VERSION is not set (see .test-versions)}
    entrypoint: ["/bin/bash", "-c", "sed 's/\\r$//' /project/docker/test-entrypoint.sh > /tmp/test-entrypoint.sh && exec /bin/bash /tmp/test-entrypoint.sh \"$@\"", "--"]

volumes:
  ps_db_data:
  ps_prestashop:
